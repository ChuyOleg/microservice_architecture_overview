spring:
  application:
    name: resource-service
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/resource-db}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  song-service:
    url: "${METADATA_API_URL:http://localhost:8084/songs}"

server:
  port: 8080
